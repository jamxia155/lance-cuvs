[package]
name = "pylance-cuvs-cu12-local"
version = "0.0.0-dev"
edition = "2024"
authors = ["Lance Devs <dev@lance.org>"]
license = "Apache-2.0"
rust-version = "1.91"
publish = false

[lib]
name = "lance_cuvs_backend_cu12_local"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:arrow-pyarrow", "dep:pyo3"]

[dependencies]
arrow = "57.0.0"
arrow-array = "57.0.0"
arrow-buffer = "57.0.0"
arrow-schema = "57.0.0"
arrow-pyarrow = { version = "57.3.0", optional = true }
# Points at the local cuVS checkout (branch `lance-gds`), not the published
# `cuvs = "=26.2.0"` crate the `cuvs_26_02` backend uses. This is the whole
# point of this backend: it lets Lance call new cuVS Rust API surface (the
# GDS/kvikio work) that only exists in that checkout, not in any released
# cuVS version. `cuvs-sys`'s build.rs locates cuVS via CMake `find_package`,
# so a matching cuVS C++ build (component `c_api`) must be built/installed
# and discoverable (e.g. via `CMAKE_PREFIX_PATH`) before this crate builds.
cuvs = { path = "../../../cuvs/rust/cuvs" }
cuvs-sys = { path = "../../../cuvs/rust/cuvs-sys" }
futures = "0.3"
half = { version = "2.5", default-features = false, features = ["num-traits", "std"] }
libc = "0.2"
# This crate depends on unreleased Lance vector-build APIs (e.g.
# `lance::index::vector::PartitionArtifactBuilder`) that postdate the pinned
# git rev below -- MACHINE-LOCAL OVERRIDE (do not commit): points at the
# local `lance` checkout (sibling directory, branch/PR with the vector-build
# API changes, e.g. `pr-7419`) instead, matching the same override
# `cuvs_26_02` requires. Restore the `git`/`rev` form before committing.
lance = { path = "../../../lance/rust/lance" }
lance-arrow = { path = "../../../lance/rust/lance-arrow" }
lance-core = { path = "../../../lance/rust/lance-core" }
lance-file = { path = "../../../lance/rust/lance-file" }
lance-index = { path = "../../../lance/rust/lance-index" }
lance-io = { path = "../../../lance/rust/lance-io" }
lance-linalg = { path = "../../../lance/rust/lance-linalg" }
log = "0.4"
ndarray = { version = "0.16.1", features = ["matrixmultiply-threading"] }
pyo3 = { version = "0.26", optional = true, features = [
    "extension-module",
    "abi3-py312",
] }
tokio = { version = "1.48", features = ["rt-multi-thread"] }
