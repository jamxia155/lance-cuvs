[project]
name = "pylance-cuvs-cu12-local"
version = "0.0.0.dev0"
description = "Local-cuVS-checkout CUDA 12 backend for pylance-cuvs (benchmarking against cuvs_26_02)"
authors = [{ name = "Lance Devs", email = "dev@lance.org" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["pyarrow>=14"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "lance_cuvs_backend_cu12_local._native"
features = ["python"]
