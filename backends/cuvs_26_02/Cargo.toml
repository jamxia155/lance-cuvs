[package]
name = "pylance-cuvs-cu12"
version = "0.0.0-dev"
edition = "2024"
authors = ["Lance Devs <dev@lance.org>"]
license = "Apache-2.0"
rust-version = "1.91"
publish = false

[lib]
name = "lance_cuvs_backend_cu12"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:arrow-pyarrow", "dep:pyo3"]

[dependencies]
arrow = "57.0.0"
# Used only by alloc_trace.rs (debug instrumentation): captures raw,
# unresolved stack frames cheaply. Deliberately not using std's
# `std::backtrace::Backtrace` -- formatting/resolving it against this
# crate's large release-with-debug binary (embedded DWARF, ~2GB+) is slow
# enough to look like a hang when done live, inside a hot allocation path.
# Symbolication is instead done offline, after capture.
backtrace = "0.3"
arrow-array = "57.0.0"
arrow-buffer = "57.0.0"
arrow-schema = "57.0.0"
arrow-pyarrow = { version = "57.3.0", optional = true }
cuvs = "=26.2.0"
cuvs-sys = "=26.2.0"
futures = "0.3"
half = { version = "2.5", default-features = false, features = ["num-traits", "std"] }
libc = "0.2"
nvtx = "1"
# This crate depends on unreleased Lance vector-build APIs (e.g.
# `lance::index::vector::PartitionArtifactBuilder`) that postdate the pinned
# git rev below -- points at the local `lance` checkout (sibling directory,
# branch/PR with the vector-build API changes, e.g. `pr-7419`) instead.
# Previously kept as a machine-local, uncommitted override; now committed so
# dev branches for the GDS benchmarking work build consistently across
# machines without requiring this edit to be reapplied by hand each time.
lance = { path = "../../../lance/rust/lance" }
lance-arrow = { path = "../../../lance/rust/lance-arrow" }
lance-core = { path = "../../../lance/rust/lance-core" }
lance-file = { path = "../../../lance/rust/lance-file" }
lance-index = { path = "../../../lance/rust/lance-index" }
lance-io = { path = "../../../lance/rust/lance-io" }
lance-linalg = { path = "../../../lance/rust/lance-linalg" }
log = "0.4"
ndarray = { version = "0.16.1", features = ["matrixmultiply-threading"] }
pyo3 = { version = "0.26", optional = true, features = [
    "extension-module",
    "abi3-py312",
] }
tokio = { version = "1.48", features = ["rt-multi-thread"] }
